name: Generate Snake Animation

# Genera la animación de la serpiente que se "come" tus contribuciones
# y la publica en la rama `output` como SVG (claro y oscuro).
on:
  # Se ejecuta todos los días a las 00:00 UTC (7:00 PM Colombia del día anterior)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # También se regenera con cada push a la rama principal
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D4FF&color_dots=#0D1117,#0a3d4d,#0a6b80,#00a8cc,#00D4FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
